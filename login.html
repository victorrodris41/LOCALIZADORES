<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard de Inventário CD</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos Customizados Externos -->
    <link rel="stylesheet" href="style.css">

    <!-- REDIRECIONA SE JÁ ESTIVER LOGADO -->
    <script>
        (function() {
            if (localStorage.getItem('userLogged')) {
                window.location.replace('index.html');
            }
        })();
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <!-- Card Principal de Login -->
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden">
        
        <!-- Topo / Cabeçalho do Card -->
        <div class="bg-indigo-900 text-white p-8 text-center relative">
            <div class="w-16 h-16 bg-indigo-700/80 rounded-2xl flex items-center justify-center mx-auto mb-4 text-indigo-200 shadow-inner">
                <i class="fa-solid fa-boxes-stacked text-3xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight">Inventário de Localizadores</h1>
            <p class="text-xs text-indigo-200 mt-1">Acesso ao Dashboard do Centro de Distribuição</p>
        </div>

        <!-- Formulário de Login -->
        <form id="form-login" onsubmit="autenticarUsuario(event)" class="p-8 space-y-5">
            
            <!-- Campo Usuário -->
            <div>
                <label for="username" class="block text-xs font-semibold uppercase text-slate-500 tracking-wider mb-2">Usuário</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="username" required placeholder="Digite seu usuário..." 
                        class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition">
                </div>
            </div>

            <!-- Campo Senha -->
            <div>
                <label for="password" class="block text-xs font-semibold uppercase text-slate-500 tracking-wider mb-2">Senha</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="password" id="password" placeholder="Digite sua senha..." 
                        class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition">
                </div>
            </div>

            <!-- Botão Entrar -->
            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-sm rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2">
                <span>Acessar Painel</span>
                <i class="fa-solid fa-right-to-bracket text-xs"></i>
            </button>

        </form>

        <!-- Rodapé do Login -->
        <div class="bg-slate-50 border-t border-slate-100 px-8 py-4 text-center">
            <p class="text-[11px] text-slate-400">Sistema Interno de Controle de Estoque & CD</p>
        </div>

    </div>

    <!-- LÓGICA DE AUTENTICAÇÃO -->
    <script>
        function autenticarUsuario(e) {
            e.preventDefault();

            const userInput = document.getElementById('username').value.trim();
            const passInput = document.getElementById('password').value.trim();

            // 1. Se for o Victor com a senha 1052: entra como Administrador
            if (userInput.toLowerCase() === 'victor' && passInput === '1052') {
                localStorage.setItem('userLogged', 'true');
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('userName', 'Victor');
            } 
            // 2. Qualquer outro nome / combinação: entra como Visualizador
            else {
                localStorage.setItem('userLogged', 'true');
                localStorage.setItem('userRole', 'user');
                localStorage.setItem('userName', userInput || 'Visitante');
            }

            // Redireciona para o Dashboard
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
